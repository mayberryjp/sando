[project]
name = "sando"
version = "0.1.0"
description = "Network monitoring and analysis tool."
authors = ["Sando <homelabids@gmail.com>"]
readme = "README.md"
requires-python = ">=3.8"

# Add your dependencies here
# These are from your Dockerfile
# You may want to add more if your code uses them
# Remove any you don't need
# You can also use 'pip freeze' to get a full list

[project.dependencies]
schedule = ">=1.1,<2.0"
requests = ">=2.28,<3.0"
bottle = ">=0.12,<0.13"
dnspython = ">=2.2,<3.0"
python-nmap = ">=0.7,<1.1"
psutil = ">=5.9,<6.0"
dnslib = ">=0.9,<1.0"
waitress = ">=2.1,<3.0"
pytz = ">=2022.1,<2024.0"

[project.scripts]
collector = "src.processes.collector:main"
processor = "src.processes.processor:main"
api = "src.processes.api:main"
discovery = "src.processes.discovery:main"
watchdog = "src.processes.watchdog:main"
fetch = "src.processes.fetch:main"
sinkholedns = "src.processes.sinkholedns:main"
dhcpserver = "src.processes.dhcpserver:main"
# Add more as needed, ensure each module has a main() function

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
