name: Sando Backend Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sando-backend-agent:
    if: github.event.label.name == 'sando_backend_agent_delegated'
    runs-on: [sando_backend_agent_delegated, self-hosted]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create agent prompt from issue
        run: |
          mkdir -p .agent

          cat > .agent/issue.md <<'EOF'
          You are working in the mayberryjp/sando repository.

          Implement the requested backend change from this GitHub issue.

          Rules:
          - Make the smallest reasonable code change.
          - Prefer backend/API/server code changes.
          - Do not edit unrelated files.
          - Do not change secrets, credentials, workflow permissions, runner config, or Docker runner configuration.
          - Do not edit files under .github/workflows unless the issue explicitly asks for workflow changes.
          - Run relevant tests if available.
          - Leave the repo in a commit-ready state.
          - If the request is ambiguous, make a conservative implementation and document assumptions in the PR.

          Definition of done:
          - The requested change is implemented.
          - Relevant tests pass, or you clearly document why tests could not be run.
          - The change is ready for human review.

          GitHub issue number:
          ${{ github.event.issue.number }}

          GitHub issue title:
          ${{ github.event.issue.title }}

          GitHub issue body:
          ${{ github.event.issue.body }}
          EOF

      - name: Make Node 20 visible to sudo and runner user
        run: |
          sudo ln -sf /opt/hostedtoolcache/node/20.20.2/x64/bin/node /usr/local/bin/node
          sudo ln -sf /opt/hostedtoolcache/node/20.20.2/x64/bin/npm /usr/local/bin/npm
          sudo ln -sf /opt/hostedtoolcache/node/20.20.2/x64/bin/npx /usr/local/bin/npx
          hash -r
          sudo -u runner -- node -v

      - name: Prepare clean Codex home
        run: |
          rm -rf "$RUNNER_TEMP/codex-home"
          mkdir -p "$RUNNER_TEMP/codex-home"
          chown -R runner:runner "$RUNNER_TEMP/codex-home"

          # Also remove the stale default config that Codex is still reading
          rm -f /home/runner/.codex/config.toml || true
          mkdir -p /home/runner/.codex
          chown -R runner:runner /home/runner/.codex

      - name: Build full issue context for Codex
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .agent

          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --json number,title,body,author,comments,labels,url \
            --jq '
              "# GitHub Issue #" + (.number|tostring) + "\n\n" +
              "URL: " + .url + "\n\n" +
              "Title: " + .title + "\n\n" +
              "Labels: " + ([.labels[].name] | join(", ")) + "\n\n" +
              "Author: @" + .author.login + "\n\n" +

              "## Original Issue Body\n\n" +
              (.body // "") + "\n\n" +

              "## Issue Comments / Conversation\n\n" +
              (
                if (.comments | length) == 0 then
                  "_No comments yet._\n"
                else
                  (
                    .comments
                    | sort_by(.createdAt)
                    | map(
                        "### Comment by @" + .author.login + " at " + .createdAt + "\n\n" +
                        (.body // "") + "\n"
                      )
                    | join("\n---\n\n")
                  )
                end
              )
            ' > .agent/issue.md

          echo "Built full issue context:"
          sed -n '1,240p' .agent/issue.md

      - name: Run Codex coding agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agent/issue.md
          output-file: .agent/codex-output.md
          codex-home: ${{ runner.temp }}/codex-home
          safety-strategy: unprivileged-user
          codex-user: runner
          sandbox: workspace-write

      - name: Show changed files
        run: |
          echo "Changed files:"
          git status --short
          echo
          git diff --name-only

      - name: Block sensitive file changes
        run: |
          CHANGED="$(git diff --name-only)"

          if echo "$CHANGED" | grep -E '(^\.env|\.pem$|\.key$|secrets|credentials)' ; then
            echo "Refusing PR because sensitive files were changed."
            exit 1
          fi

          if echo "$CHANGED" | grep -E '^\.github/workflows/' ; then
            echo "Refusing PR because workflow files were changed."
            exit 1
          fi

          if echo "$CHANGED" | grep -E '(^docker-compose\.ya?ml$|^compose\.ya?ml$)' ; then
            echo "Refusing PR because Docker compose files were changed."
            exit 1
          fi

      - name: Run basic validation
        run: |
          set -e

          if [ -f package.json ]; then
            echo "Detected package.json"
            npm install
            npm test --if-present
          fi

          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Detected Python project"
            python3 -m compileall .
          fi

      - name: Create branch and PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes made by agent."
            exit 0
          fi

          BRANCH="sando-backend-agent/issue-${{ github.event.issue.number }}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add .

          git commit -m "Sando backend agent work for issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Sando backend agent work for issue #${{ github.event.issue.number }}" \
            --body-file .agent/codex-output.md \
            --base main \
            --head "$BRANCH"
